name: CI

on: [push, pull_request]

jobs:

  testsuite:
    name: all tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env:
          - { TYPO3_VERSION: ^12.4, PHP: '8.1' }
          - { TYPO3_VERSION: ^12.4, PHP: '8.2' }
          - { TYPO3_VERSION: ^12.4, PHP: '8.3' }
          - { TYPO3_VERSION: ^12.4, PHP: '8.4' }
          - { TYPO3_VERSION: ^13.4, PHP: '8.2' }
          - { TYPO3_VERSION: ^13.4, PHP: '8.3' }
          - { TYPO3_VERSION: ^13.4, PHP: '8.4' }


    env: ${{ matrix.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install
        run: ./Build/Scripts/runTests.sh composer update --with="typo3/cms-core:${TYPO3_VERSION}"

      - name: Lint PHP
        run: ./Build/Scripts/runTests.sh composer ci:php:lint

      - name: PHP Coding Standards Fixer
        run: ./Build/Scripts/runTests.sh composer ci:php:cs

      - name: PHPStan
        run: ./Build/Scripts/runTests.sh composer ci:php:stan

      - name: PHP Mess Detector
        run: ./Build/Scripts/runTests.sh composer ci:php:md

      - name: Unit tests
        run: ./Build/Scripts/runTests.sh unit
